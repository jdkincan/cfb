# cfbmeta configuration
#
# Everything here has a working default. The values most worth revisiting are
# `weights`, `sigma_margin` and `edge_shrink` — and rather than guessing at
# them, run:
#
#     python -m cfbmeta backtest --years 5 --fit --write
#
# which measures all three against real results and writes them back here.

season: 0            # 0 = infer from today's date
timezone: America/New_York
send_hour_local: 7   # the workflow fires twice and only this hour sends
season_type: regular
slate_window_days: 6      # one playing weekend; a CFBD week can hold two
fbs_only: true            # screen out FCS opponents

# ---------------------------------------------------------------------------
# Blend weights over the rating sources.
#
# `market` stays at 0 on purpose. The closing line is the benchmark we are
# trying to beat, so folding it into the forecast would launder away the very
# disagreement we are looking for. Raise it only if a backtest shows the blend
# is genuinely worse than the line.
# ---------------------------------------------------------------------------
# NOTE: these were fitted on a 'prior' basis (last season's final ratings),
# which is the only fair basis available until snapshots accumulate. That basis
# favours whichever source is most forward-looking, which is why talent lands
# so high — with current-season SP+ available the balance would differ. Treat
# them as measured-but-provisional. See calibration/backtest.json.
weights:
  sp_plus: 0.4398  # Bill Connelly's SP+, the strongest single public rating
  fpi: 0.2395  # ESPN's Football Power Index
  elo: 0.0018
  srs: 0.0
  talent: 0.3189  # 247 composite: a prior on roster quality, not on form
  # In-season opponent-adjusted efficiency, rebuilt weekly from per-game
  # advanced stats. Reconstructed backtest over 2023-25 fit it at 0.395 against
  # ridge margin ratings and cut MAE from 13.32 to 12.78; against the preseason
  # sources it earns less, and it is ramped in by prior_weight_by_week because
  # in September it is fitting three games. Absent early in the year, which
  # costs nothing: the remaining weights renormalize.
  efficiency: 0.18
  market: 0.00

# Fraction of each week's Elo/SRS weight shifted to the preseason-anchored
# sources. Those two describe only results so far, which in September is noise.
# Week 0 is listed explicitly, and anything earlier than the first entry
# clamps to it, so the season's first games never hand Elo/SRS full weight.
prior_weight_by_week:
  0: 0.80
  1: 0.75
  2: 0.60
  3: 0.45
  4: 0.30
  5: 0.18
  6: 0.10
  7: 0.05

# ---------------------------------------------------------------------------
# Uncertainty
# ---------------------------------------------------------------------------
sigma_margin: 19.32  # SD of (actual - projected) margin; ~16 is typical for CFB
sigma_total: 13.5

# ---------------------------------------------------------------------------
# Home field. Estimated per venue from five seasons of results and shrunk hard
# toward the league mean, so a couple of flukey home blowouts don't buy a team
# a six-point home field.
# ---------------------------------------------------------------------------
league_hfa: 2.70          # measured from 4 seasons of rating-controlled home games
hfa_shrink_games: 60.0
hfa_max: 5.0
hfa_min: 0.0
altitude_bonus_per_1k_ft: 0.22
altitude_threshold_ft: 3000.0

# ---------------------------------------------------------------------------
# Adjustment caps. Each knob is capped on its own and again in aggregate, so no
# single soft factor can run away with a projection.
# ---------------------------------------------------------------------------
coach_adj_cap: 1.5
rest_adj_cap: 2.0
travel_adj_cap: 1.2
total_adj_cap: 4.0

bye_week_bonus: 1.0
short_week_penalty: 0.8
rest_day_value: 0.10
travel_penalty_per_1k_mi: 0.35

# ---------------------------------------------------------------------------
# Betting
# ---------------------------------------------------------------------------
vig_price: -110
# How much of our disagreement with the market to treat as real signal. At 1.0
# we'd be claiming the closing line is wrong by the full amount every time we
# differ from it, which is not a defensible starting position for a model built
# from public ratings. Fit it with `backtest --fit`.
edge_shrink: 0.35
kelly_fraction: 0.25       # quarter Kelly
bankroll_units: 100.0      # 1 unit = 1% of bankroll
min_edge_points: 1.5       # below this, not a play
strong_edge_points: 3.0    # highlighted in the email
max_units_per_play: 3.0
max_weekly_units: 10.0        # total units at risk in one week, after correlation
within_group_correlation: 0.4 # assumed correlation between same-day, same-conf bets
use_best_line: true           # size against the best number available, not the median

# --- odds feed ---------------------------------------------------------------
# Set ODDS_API_KEY in .env to pull spreads from the-odds-api.com. That widens
# line shopping past CFBD's DraftKings/ESPN Bet/Bovada and, more importantly,
# brings in Pinnacle as a sharp reference price. Without the key these do
# nothing and CFBD's lines are used unchanged.
odds_api_regions: us,us2
# Measure edge against the sharpest book that quoted the game instead of a
# median of retail books. A median of slow books cannot tell "the model is
# right" apart from "those books have not moved yet".
prefer_sharp_benchmark: true

# ---------------------------------------------------------------------------
# Reporting and data
# ---------------------------------------------------------------------------
email_subject_prefix: CFB Meta Forecast

cfbd_base_url: https://api.collegefootballdata.com
request_timeout: 30
max_retries: 4
cache_dir: data/cache
cache_ttl_minutes: 360
